name: Release

# Runs when a version tag is pushed, for example `git tag 1.0.0 && git push origin 1.0.0`.
# The tag is the bare version with no "v", and must equal "version" in manifest.json (the check
# below fails the run otherwise). It builds the plugin and attaches main.js, manifest.json and
# styles.css to a GitHub release as separate files, which is what Obsidian downloads.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check the tag and the rules
        run: npm run check:release -- --built --tag "${GITHUB_REF_NAME}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --generate-notes
